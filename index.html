<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>خريطة موقعي</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    #map {
      width: 100%;
      height: 500px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      margin: 15px;
    }
  </style>
</head>

<body>

  <button onclick="getLocation()">📍 تحديد موقعي</button>

  <p id="message">اضغط على الزر</p>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    // إنشاء الخريطة
    const map = L.map("map").setView([36.7538, 3.0588], 12);

    // تحميل خريطة OpenStreetMap
    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }
    ).addTo(map);


    let userMarker;


    function getLocation() {

      const message = document.getElementById("message");

      if (!navigator.geolocation) {
        message.innerHTML = "❌ المتصفح لا يدعم تحديد الموقع";
        return;
      }

      message.innerHTML = "📍 جارٍ تحديد موقعك...";


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          message.innerHTML =
            "✅ تم تحديد موقعك";


          // تحريك الخريطة إلى الموقع
          map.setView([lat, lon], 17);


          // حذف العلامة القديمة
          if (userMarker) {
            map.removeLayer(userMarker);
          }


          // وضع علامة على الموقع
          userMarker = L.marker([lat, lon])
            .addTo(map)
            .bindPopup("📍 أنت هنا")
            .openPopup();

        },

        function(error) {

          message.innerHTML =
            "❌ لم نتمكن من تحديد موقعك: " + error.message;

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

  </script>

</body>
</html>
