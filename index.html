<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>خريطة العالم 3D</title>

  <!-- Cesium -->
  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/";
  </script>

  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Tahoma, sans-serif;
      background: #000;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* =========================
       الشريط العلوي
    ========================= */

    #topBar {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;

      min-height: 58px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 10px;

      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;

      box-shadow: 0 8px 30px rgba(0,0,0,0.35);

      color: white;
    }

    #title {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      margin-left: auto;
    }

    .topButton {
      border: none;
      outline: none;

      color: white;
      background: rgba(255,255,255,0.10);

      padding: 10px 13px;
      border-radius: 10px;

      cursor: pointer;
      font-size: 14px;

      transition: 0.2s;
      white-space: nowrap;
    }

    .topButton:hover {
      background: rgba(255,255,255,0.20);
    }

    .topButton.active {
      background: #2563eb;
    }

    /* =========================
       البحث
    ========================= */

    #searchArea {
      position: absolute;
      z-index: 1100;

      top: 82px;
      right: 12px;

      width: min(420px, calc(100% - 24px));

      display: flex;
      gap: 7px;
    }

    #searchInput {
      flex: 1;

      min-width: 0;

      border: 1px solid rgba(255,255,255,0.15);
      outline: none;

      color: white;
      background: rgba(15,23,42,0.92);

      padding: 12px 14px;

      border-radius: 12px;

      font-size: 15px;

      backdrop-filter: blur(10px);
    }

    #searchInput::placeholder {
      color: #cbd5e1;
    }

    #searchButton {
      border: none;
      cursor: pointer;

      color: white;
      background: #2563eb;

      padding: 0 16px;

      border-radius: 12px;

      font-size: 15px;
    }

    /* =========================
       لوحة الإعدادات
    ========================= */

    #settingsPanel {
      position: absolute;
      z-index: 1200;

      top: 82px;
      left: 12px;

      width: 250px;

      background: rgba(15,23,42,0.95);
      backdrop-filter: blur(14px);

      color: white;

      padding: 16px;

      border-radius: 14px;

      border: 1px solid rgba(255,255,255,0.12);

      box-shadow: 0 12px 35px rgba(0,0,0,0.35);

      display: none;
    }

    #settingsPanel.show {
      display: block;
    }

    #settingsPanel h3 {
      margin: 0 0 14px 0;
      font-size: 17px;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 9px;

      padding: 9px 0;

      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .setting:last-child {
      border-bottom: none;
    }

    .setting input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* =========================
       رسالة الحالة
    ========================= */

    #message {
      position: absolute;
      z-index: 1500;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      color: white;

      background: rgba(15,23,42,0.90);
      backdrop-filter: blur(10px);

      padding: 10px 18px;

      border-radius: 10px;

      font-size: 14px;

      display: none;

      max-width: calc(100% - 30px);
      text-align: center;
    }

    /* =========================
       علامة الموقع
    ========================= */

    .locationLabel {
      color: white;
      background: rgba(15,23,42,0.9);

      padding: 6px 10px;

      border-radius: 8px;

      font-size: 13px;

      border: 1px solid rgba(255,255,255,0.15);
    }

    /* إخفاء بعض عناصر Cesium الافتراضية */
    .cesium-viewer-toolbar {
      display: none !important;
    }

    .cesium-viewer-bottom {
      font-size: 10px;
    }

    /* =========================
       الهاتف
    ========================= */

    @media (max-width: 700px) {

      #topBar {
        top: 7px;
        left: 7px;
        right: 7px;

        padding: 6px;

        gap: 5px;

        overflow-x: auto;
      }

      #title {
        display: none;
      }

      .topButton {
        padding: 9px 10px;
        font-size: 13px;
      }

      #searchArea {
        top: 75px;
        right: 7px;

        width: calc(100% - 14px);
      }

      #settingsPanel {
        top: 75px;
        left: 7px;

        width: calc(100% - 14px);
        max-width: 300px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       الخريطة
  ========================= -->

  <div id="cesiumContainer"></div>


  <!-- =========================
       الشريط العلوي
  ========================= -->

  <div id="topBar">

    <div id="title">
      🌍 خريطة العالم 3D
    </div>

    <button
      class="topButton active"
      id="satelliteBtn"
      onclick="setMapType('satellite')">
      🛰️ قمر صناعي
    </button>

    <button
      class="topButton"
      id="normalBtn"
      onclick="setMapType('normal')">
      🗺️ عادية
    </button>

    <button
      class="topButton"
      onclick="go3D()">
      🌍 3D
    </button>

    <button
      class="topButton"
      onclick="go2D()">
      🗺️ 2D
    </button>

    <button
      class="topButton"
      onclick="findMyLocation()">
      📍 موقعي
    </button>

    <button
      class="topButton"
      onclick="toggleSettings()">
      ⚙️ الإعدادات
    </button>

    <button
      class="topButton"
      onclick="toggleFullscreen()">
      ⛶
    </button>

  </div>


  <!-- =========================
       البحث
  ========================= -->

  <div id="searchArea">

    <input
      id="searchInput"
      type="text"
      placeholder="🔎 ابحث عن مدينة أو مكان..."
      autocomplete="off"
    >

    <button
      id="searchButton"
      onclick="searchPlace()">
      بحث
    </button>

  </div>


  <!-- =========================
       الإعدادات
  ========================= -->

  <div id="settingsPanel">

    <h3>⚙️ إعدادات الخريطة</h3>

    <label class="setting">
      <input
        id="placesToggle"
        type="checkbox"
        checked
        onchange="updateReferenceLayer()"
      >

      <span>🏙️ أسماء المدن والأماكن والحدود</span>
    </label>

    <label class="setting">
      <input
        id="roadsToggle"
        type="checkbox"
        onchange="updateRoadsLayer()"
      >

      <span>🛣️ الطرق</span>
    </label>

    <label class="setting">
      <input
        id="rotationToggle"
        type="checkbox"
        checked
        onchange="toggleRotation()"
      >

      <span>🔄 دوران الخريطة</span>
    </label>

  </div>


  <!-- =========================
       الرسائل
  ========================= -->

  <div id="message"></div>


<script>

  /*
   * ============================================================
   * إعداد الروابط
   * ============================================================
   */

  const MAP_SERVICES = {

    satellite:
      "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer",

    normal:
      "https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer",

    reference:
      "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer",

    roads:
      "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer"

  };


  /*
   * ============================================================
   * إنشاء Viewer
   * ============================================================
   */

  const viewer = new Cesium.Viewer("cesiumContainer", {

    animation: false,

    timeline: false,

    baseLayerPicker: false,

    geocoder: false,

    homeButton: false,

    sceneModePicker: false,

    navigationHelpButton: false,

    fullscreenButton: false,

    infoBox: true,

    selectionIndicator: true,

    /*
     * لا نستخدم Cesium World Terrain هنا حتى يعمل المشروع
     * بدون الحاجة إلى Cesium Ion Token.
     */
    terrainProvider: new Cesium.EllipsoidTerrainProvider()

  });


  /*
   * تحسين التحكم بالكاميرا
   */

  viewer.scene.screenSpaceCameraController.enableTilt = true;

  viewer.scene.screenSpaceCameraController.enableRotate = true;

  viewer.scene.screenSpaceCameraController.enableZoom = true;

  viewer.scene.screenSpaceCameraController.enableTranslate = true;


  /*
   * ============================================================
   * الطبقات
   * ============================================================
   */

  let baseLayer = null;

  let referenceLayer = null;

  let roadsLayer = null;

  let currentMapType = "satellite";


  /*
   * ============================================================
   * رسالة للمستخدم
   * ============================================================
   */

  function showMessage(text, time = 3000) {

    const box = document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    clearTimeout(window.messageTimer);

    window.messageTimer = setTimeout(() => {

      box.style.display = "none";

    }, time);
  }


  /*
   * ============================================================
   * إضافة طبقة ArcGIS
   *
   * نستخدم fromUrl() الحديثة.
   * ============================================================
   */

  function addArcGISLayer(url) {

    const providerPromise =
      Cesium.ArcGisMapServerImageryProvider.fromUrl(url);

    const layer =
      Cesium.ImageryLayer.fromProviderAsync(providerPromise);

    viewer.imageryLayers.add(layer);

    return layer;
  }


  /*
   * ============================================================
   * تغيير الخريطة
   * ============================================================
   */

  async function setMapType(type) {

    currentMapType = type;

    showMessage("⏳ جاري تحميل الخريطة...");


    /*
     * حذف الطبقة الأساسية القديمة
     */

    if (baseLayer) {

      viewer.imageryLayers.remove(
        baseLayer,
        true
      );

      baseLayer = null;
    }


    /*
     * اختيار الخريطة
     */

    const url =
      type === "satellite"
        ? MAP_SERVICES.satellite
        : MAP_SERVICES.normal;


    try {

      baseLayer = addArcGISLayer(url);

      /*
       * تحديث أزرار الواجهة
       */

      document
        .getElementById("satelliteBtn")
        .classList.toggle(
          "active",
          type === "satellite"
        );

      document
        .getElementById("normalBtn")
        .classList.toggle(
          "active",
          type === "normal"
        );


      /*
       * إعادة طبقة أسماء الأماكن
       */

      await refreshReferenceLayer();

      showMessage(
        type === "satellite"
          ? "🛰️ تم تشغيل صور الأقمار الصناعية"
          : "🗺️ تم تشغيل الخريطة العادية"
      );

    } catch (error) {

      console.error(error);

      showMessage(
        "❌ تعذر تحميل الخريطة. تحقق من اتصال الإنترنت."
      );

    }

  }


  /*
   * ============================================================
   * طبقة أسماء المدن والحدود
   * ============================================================
   */

  async function refreshReferenceLayer() {

    /*
     * حذف القديمة
     */

    if (referenceLayer) {

      viewer.imageryLayers.remove(
        referenceLayer,
        true
      );

      referenceLayer = null;
    }


    /*
     * إذا كانت مغلقة لا نفعل شيئا
     */

    const enabled =
      document.getElementById("placesToggle").checked;


    if (!enabled) {

      return;
    }


    try {

      referenceLayer =
        addArcGISLayer(
          MAP_SERVICES.reference
        );

    } catch (error) {

      console.error(error);

    }

  }


  /*
   * ============================================================
   * تحديث أسماء الأماكن
   * ============================================================
   */

  function updateReferenceLayer() {

    refreshReferenceLayer();

  }


  /*
   * ============================================================
   * الطرق
   * ============================================================
   */

  function updateRoadsLayer() {

    const enabled =
      document.getElementById("roadsToggle").checked;


    if (roadsLayer) {

      viewer.imageryLayers.remove(
        roadsLayer,
        true
      );

      roadsLayer = null;

    }


    if (!enabled) {

      return;

    }


    try {

      roadsLayer =
        addArcGISLayer(
          MAP_SERVICES.roads
        );

    } catch (error) {

      console.error(error);

    }

  }


  /*
   * ============================================================
   * الوضع 3D
   * ============================================================
   */

  function go3D() {

    viewer.scene.morphTo3D(1.2);

    showMessage("🌍 وضع 3D");

  }


  /*
   * ============================================================
   * الوضع 2D
   * ============================================================
   */

  function go2D() {

    viewer.scene.morphTo2D(1.2);

    showMessage("🗺️ وضع 2D");

  }


  /*
   * ============================================================
   * الإعدادات
   * ============================================================
   */

  function toggleSettings() {

    const panel =
      document.getElementById("settingsPanel");

    panel.classList.toggle("show");

  }


  /*
   * ============================================================
   * الدوران
   * ============================================================
   */

  let rotating = false;

  let rotationHandler = null;


  function toggleRotation() {

    const enabled =
      document.getElementById("rotationToggle").checked;


    rotating = enabled;


    if (enabled) {

      startRotation();

    } else {

      stopRotation();

    }

  }


  function startRotation() {

    if (rotationHandler) {

      return;

    }


    rotationHandler = viewer.clock.onTick.addEventListener(
      function() {

        if (!rotating) {

          return;

        }

        viewer.scene.camera.rotate(
          Cesium.Cartesian3.UNIT_Z,
          0.00025
        );

      }
    );

  }


  function stopRotation() {

    rotating = false;

    if (rotationHandler) {

      rotationHandler();

      rotationHandler = null;

    }

  }


  /*
   * ============================================================
   * تحديد موقع المستخدم
   * ============================================================
   */

  function findMyLocation() {

    if (!navigator.geolocation) {

      showMessage(
        "❌ المتصفح لا يدعم تحديد الموقع."
      );

      return;
    }


    showMessage(
      "📍 جاري تحديد موقعك..."
    );


    navigator.geolocation.getCurrentPosition(

      function(position) {

        const longitude =
          position.coords.longitude;

        const latitude =
          position.coords.latitude;


        /*
         * حذف العلامة القديمة
         */

        if (window.userLocationEntity) {

          viewer.entities.remove(
            window.userLocationEntity
          );

        }


        /*
         * إنشاء علامة جديدة
         */

        window.userLocationEntity =
          viewer.entities.add({

            name: "موقعي",

            position:
              Cesium.Cartesian3.fromDegrees(
                longitude,
                latitude
              ),

            point: {

              pixelSize: 16,

              outlineColor:
                Cesium.Color.WHITE,

              outlineWidth: 3,

              color:
                Cesium.Color.RED

            },

            label: {

              text: "📍 موقعي",

              font:
                "bold 15px Arial",

              fillColor:
                Cesium.Color.WHITE,

              outlineColor:
                Cesium.Color.BLACK,

              outlineWidth: 3,

              style:
                Cesium.LabelStyle.FILL_AND_OUTLINE,

              verticalOrigin:
                Cesium.VerticalOrigin.BOTTOM,

              pixelOffset:
                new Cesium.Cartesian2(0, -18)

            }

          });


        /*
         * الانتقال إلى الموقع
         */

        viewer.camera.flyTo({

          destination:
            Cesium.Cartesian3.fromDegrees(
              longitude,
              latitude,
              5000
            ),

          duration: 2

        });


        showMessage(
          "📍 تم تحديد موقعك"
        );

      },


      function(error) {

        console.error(error);


        let message =
          "❌ تعذر تحديد موقعك";


        if (error.code === 1) {

          message =
            "❌ يجب السماح للمتصفح بالوصول إلى موقعك.";

        }

        if (error.code === 2) {

          message =
            "❌ لم يتم العثور على الموقع.";

        }

        if (error.code === 3) {

          message =
            "❌ انتهت مهلة تحديد الموقع.";

        }


        showMessage(
          message,
          5000
        );

      },

      {

        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 0

      }

    );

  }


  /*
   * ============================================================
   * البحث عن مدينة أو مكان
   * ============================================================
   */

  async function searchPlace() {

    const input =
      document.getElementById("searchInput");

    const query =
      input.value.trim();


    if (!query) {

      showMessage(
        "🔎 اكتب اسم مدينة أو مكان."
      );

      return;
    }


    showMessage(
      "🔎 جاري البحث..."
    );


    try {

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&limit=1" +
        "&q=" +
        encodeURIComponent(query);


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "Search failed"
        );

      }


      const results =
        await response.json();


      if (!results.length) {

        showMessage(
          "❌ لم يتم العثور على المكان."
        );

        return;

      }


      const result =
        results[0];


      const latitude =
        parseFloat(result.lat);

      const longitude =
        parseFloat(result.lon);


      /*
       * حذف نتيجة البحث السابقة
       */

      if (window.searchEntity) {

        viewer.entities.remove(
          window.searchEntity
        );

      }


      /*
       * إنشاء العلامة
       */

      window.searchEntity =
        viewer.entities.add({

          name: result.display_name,

          position:
            Cesium.Cartesian3.fromDegrees(
              longitude,
              latitude
            ),

          point: {

            pixelSize: 14,

            color:
              Cesium.Color.YELLOW,

            outlineColor:
              Cesium.Color.BLACK,

            outlineWidth: 3

          },

          label: {

            text:
              result.display_name,

            font:
              "bold 14px Arial",

            fillColor:
              Cesium.Color.WHITE,

            outlineColor:
              Cesium.Color.BLACK,

            outlineWidth: 3,

            style:
              Cesium.LabelStyle.FILL_AND_OUTLINE,

            verticalOrigin:
              Cesium.VerticalOrigin.BOTTOM,

            pixelOffset:
              new Cesium.Cartesian2(
                0,
                -18
              )

          }

        });


      /*
       * الانتقال للمكان
       */

      viewer.camera.flyTo({

        destination:
          Cesium.Cartesian3.fromDegrees(
            longitude,
            latitude,
            7000
          ),

        duration: 2

      });


      showMessage(
        "📍 " + result.display_name,
        5000
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "❌ حدث خطأ أثناء البحث."
      );

    }

  }


  /*
   * ============================================================
   * البحث بالضغط على Enter
   * ============================================================
   */

  document
    .getElementById("searchInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          searchPlace();

        }

      }
    );


  /*
   * ============================================================
   * ملء الشاشة
   * ============================================================
   */

  function toggleFullscreen() {

    const element =
      document.documentElement;


    if (!document.fullscreenElement) {

      if (element.requestFullscreen) {

        element.requestFullscreen();

      }

    } else {

      if (document.exitFullscreen) {

        document.exitFullscreen();

      }

    }

  }


  /*
   * ============================================================
   * موقع البداية
   *
   * الجزائر
   * ============================================================
   */

  viewer.camera.flyTo({

    destination:
      Cesium.Cartesian3.fromDegrees(
        2.5,
        28.0,
        3000000
      ),

    duration: 0

  });


  /*
   * ============================================================
   * تحميل الخريطة الأولى
   * ============================================================
   */

  setMapType("satellite");


</script>

</body>
</html>
